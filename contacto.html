<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<nav>
		<ul>
			<li><a href="index.html">Home</a></li>
		</ul>
	</nav>

	<main class="container">
		<h1>Contact</h1>
		<p>If you'd like to get in touch, send an email to <a href="mailto:christian@example.com">christian@example.com</a> or use the form below.</p>

		<form action="#" method="post" style="max-width:600px;">
			<label for="name">Name</label><br>
			<input id="name" name="name" type="text" style="width:100%; padding:8px; margin-bottom:8px;"><br>
			<label for="email">Email</label><br>
			<input id="email" name="email" type="email" style="width:100%; padding:8px; margin-bottom:8px;"><br>
			<label for="message">Message</label><br>
			<textarea id="message" name="message" rows="6" style="width:100%; padding:8px; margin-bottom:8px;"></textarea><br>
			<button type="submit">Send</button>
		</form>
	</main>

	<footer>
		<p style="text-align:center;">Developed by Christian Vera - 2025</p>
	</footer>
</body>
</html>
