<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4361ee"/>
      <stop offset="50%" stop-color="#3a86ff"/>
      <stop offset="100%" stop-color="#06d6a0"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06d6a0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4361ee" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Shaded area under data trajectory -->
  <polygon points="14,46 26,34 38,40 50,18 50,50 14,50" fill="url(#areaGrad)"/>

  <!-- Connected trend line -->
  <polyline points="14,46 26,34 38,40 50,18" 
            fill="none" 
            stroke="url(#strokeGrad)" 
            stroke-width="4.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            filter="url(#glow)"/>

  <!-- Data Nodes -->
  <circle cx="14" cy="46" r="3.5" fill="#4361ee"/>
  <circle cx="26" cy="34" r="3.5" fill="#3a86ff"/>
  <circle cx="38" cy="40" r="3.5" fill="#4361ee"/>
  
  <!-- Highlight peak node with radiant aura -->
  <circle cx="50" cy="18" r="6" fill="#06d6a0" opacity="0.3"/>
  <circle cx="50" cy="18" r="4.5" fill="#06d6a0"/>
  <circle cx="50" cy="18" r="2" fill="#ffffff"/>
</svg>
